
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card login">
        <h1>🎓</h1>
        <h2>STUDENT STUDY PLANNER</h2>
        <p>Plan • Study • Achieve</p>

        <form onsubmit="login(event)">
            <input type="email" placeholder="✉️ Enter your email" required>
            <input type="password" placeholder="🔒 Enter your password" required>
            <button type="submit">Login</button>
        </form>

        <p><a href="#" onclick="alert('Contact administrator to reset password')">Forgot Password?</a></p>
        <p>OR</p>
        <a href="register.html">Create New Account</a>
    </div>

    <script>
        function login(event) {
            event.preventDefault();
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
